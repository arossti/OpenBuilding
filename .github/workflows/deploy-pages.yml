name: Deploy OpenBuilding.ca to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    # Publishes arossti.github.io/OpenBuilding/; skipped on any fork.
    if: github.repository == 'arossti/OpenBuilding'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage deployable site into _site/
        # Repo is flat post-cleanup (session 2026-04-20): HTML + CSS + js/
        # live at root, so we compose a clean Pages artifact here rather
        # than upload the whole repo (which would otherwise include schema/
        # as source, docs/, the .md workplans, dev configs, etc.).
        #
        # Local dev runs `npm run stage:data` to stage data/, including the
        # local-only catalogue database.html reads.
        run: |
          mkdir -p _site/data

          # Deployable app surface
          cp index.html takeoffeh.html objectivepro.html dependencies.html _site/
          cp obstyles.css _site/
          cp -r js graphics lib builders src climate _site/

          # Runtime data. The BEAM material catalogue (schema/), database.html and
          # the BEAM sample project are BfCA's data: kept in the repo for local use
          # (`npm run stage:data`), never deployed (Andy 2026-11-25).
          cp docs/sample.pdf _site/data/sample.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
